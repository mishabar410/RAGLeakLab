# RAGLeakLab Configuration for FastAPI Target Example
#
# This config tests the local FastAPI server at localhost:8000.
#
# Usage:
#   1. Start the server: uvicorn examples.fastapi_target.app:app --port 8000
#   2. Run RAGLeakLab:
#      ragleaklab run --config examples/fastapi_target/ragleaklab.yaml \
#        --corpus data/corpus_private_canary --attacks data/attacks --out out/

# Target: HTTP endpoint
target:
  type: http
  url: http://127.0.0.1:8000/ask
  method: POST
  request_json:
    question: "{{query}}"
  response:
    answer_field: "answer"
  timeout_sec: 30

# Thresholds for metrics
thresholds:
  verbatim_delta: 0.01
  membership_delta: 0.05
