name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands to reproduce the issue
      placeholder: |
        1. Install: `uv sync --all-extras`
        2. Run: `ragleaklab run --config ... --corpus ... --attacks ... --out out/`
        3. See error: `...`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages and stack traces.
    validations:
      required: true

  - type: dropdown
    id: packs_affected
    attributes:
      label: Packs Affected
      description: Which threat packs are involved?
      multiple: true
      options:
        - canary-basic
        - semantic-basic
        - membership-basic
        - crossdoc-basic
        - sentinel-takeover-safe
        - All packs
        - Not pack-related
    validations:
      required: true

  - type: dropdown
    id: determinism
    attributes:
      label: Is this reproducible?
      description: Does the bug happen consistently, or is it intermittent?
      options:
        - Always reproducible
        - Intermittent
        - Only on first run
        - Only in CI
    validations:
      required: true

  - type: textarea
    id: baseline_impact
    attributes:
      label: Baseline / Output Impact
      description: |
        Does this affect report outputs or baselines?
        Include relevant diffs from `report.json`, `runs.jsonl`, or SARIF.
      render: diff

  - type: input
    id: version
    attributes:
      label: RAGLeakLab Version
      description: Output of `ragleaklab version`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.12.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant logs or error messages
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have not included any secrets or sensitive data
          required: true
        - label: I have verified this with the latest version
          required: false
