name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string
      publish_pypi:
        description: 'Publish to PyPI'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  
jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Validate assets
        run: uv run python -m ragleaklab assets validate --path .

      - name: Verify determinism
        run: uv run python -m ragleaklab verify-determinism --path data/corpus_private_canary --samples 3

  build:
    name: Build Package
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      wheel_name: ${{ steps.build.outputs.wheel_name }}
      sdist_name: ${{ steps.build.outputs.sdist_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Update version in pyproject.toml
        run: |
          sed -i "s/version = \".*\"/version = \"${{ inputs.version }}\"/" pyproject.toml
          cat pyproject.toml | grep "version"

      - name: Build package
        id: build
        run: |
          uv build
          echo "wheel_name=$(ls dist/*.whl | xargs basename)" >> $GITHUB_OUTPUT
          echo "sdist_name=$(ls dist/*.tar.gz | xargs basename)" >> $GITHUB_OUTPUT

      - name: Generate SBOM
        run: |
          uv run python scripts/generate_sbom.py --out dist/sbom.json
          cat dist/sbom.json | head -50

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # Uncomment when ready to publish to PyPI
  # publish:
  #   name: Publish to PyPI
  #   needs: build
  #   runs-on: ubuntu-latest
  #   if: ${{ inputs.publish_pypi }}
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/ragleaklab
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Download artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist/
  #
  #     - name: Install uv
  #       uses: astral-sh/setup-uv@v4
  #       with:
  #         version: "latest"
  #
  #     - name: Publish to PyPI
  #       run: uv publish
  #       env:
  #         UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          draft: true
          prerelease: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.json
          body: |
            ## Release v${{ inputs.version }}

            ### Artifacts
            - Wheel: `${{ needs.build.outputs.wheel_name }}`
            - Source: `${{ needs.build.outputs.sdist_name }}`
            - SBOM: `sbom.json`

            ### Verification
            ```bash
            # Verify wheel hash
            sha256sum dist/*.whl

            # Verify SBOM
            cat dist/sbom.json | jq '.metadata.component'
            ```

            ### Changes
            See CHANGELOG.md for details.
