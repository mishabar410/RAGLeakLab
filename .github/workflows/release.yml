name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      publish_pypi:
        description: 'Publish to PyPI (requires PYPI_API_TOKEN secret)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras

      - name: CI smoke (format + lint + test + packs + regression + determinism)
        run: bash scripts/ci_smoke.sh

      - name: Contract tests
        run: uv run pytest tests/contracts/ -v

  build:
    name: Build & Package
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      wheel_name: ${{ steps.build.outputs.wheel_name }}
      sdist_name: ${{ steps.build.outputs.sdist_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras

      - name: Bump version in pyproject.toml
        run: |
          sed -i "s/version = \".*\"/version = \"${{ inputs.version }}\"/" pyproject.toml
          grep 'version' pyproject.toml | head -1

      - name: Build wheel + sdist
        id: build
        run: |
          uv build
          echo "wheel_name=$(ls dist/*.whl | xargs basename)" >> $GITHUB_OUTPUT
          echo "sdist_name=$(ls dist/*.tar.gz | xargs basename)" >> $GITHUB_OUTPUT

      - name: Generate SBOM (CycloneDX)
        run: uv run python scripts/generate_sbom.py --out dist/sbom.json

      - name: Generate sample report
        run: |
          uv run python -m ragleaklab run \
            --corpus data/corpus_private_canary \
            --attacks data/attacks \
            --out out/
          cp out/report.json dist/sample_report.json

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90

  # Uncomment when PYPI_API_TOKEN secret is configured
  # publish:
