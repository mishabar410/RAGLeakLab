name: Nightly

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  robustness-suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run fast tests (exclude slow)
        run: uv run pytest -q -m "not slow"

      - name: Run slow/robustness tests
        run: uv run pytest -q -m "slow" --tb=short

      - name: Full security audit
        run: |
          uv run python -m ragleaklab run \
            --corpus data/corpus_private_canary \
            --attacks data/attacks \
            --out out/

      - name: Regression check
        run: |
          uv run python -m ragleaklab diff \
            --baseline baselines/v1/report.json \
            --current out/report.json

      - name: Save reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: out/
          retention-days: 7

  semantic-pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run semantic pack
        run: |
          uv run python -m ragleaklab run \
            --corpus data/corpus_private_canary \
            --pack semantic-basic \
            --out out/semantic/

      - name: Semantic regression check
        run: |
          uv run python -m ragleaklab diff \
            --baseline baselines/semantic_v1/report.json \
            --current out/semantic/report.json

      - name: Save semantic reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-semantic-reports
          path: out/semantic/
          retention-days: 7
