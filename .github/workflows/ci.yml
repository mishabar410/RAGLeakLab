name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q -m "not slow"

      - name: Validate assets
        run: uv run python -m ragleaklab assets validate --path .

      - name: Run security audit
        run: |
          uv run python -m ragleaklab run \
            --corpus data/corpus_private_canary \
            --attacks data/attacks \
            --out out/

      - name: Regression check
        run: |
          uv run python -m ragleaklab diff \
            --baseline baselines/v1/report.json \
            --current out/report.json

      - name: Determinism check
        run: |
          uv run python -m ragleaklab verify determinism \
            --pack canary-basic \
            --runs 2 \
            --out out/determinism/

      - name: Export SARIF
        if: always()
        run: |
          uv run python -m ragleaklab export \
            --format sarif \
            --input out/report.json \
            --output out/report.sarif || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: out/
          retention-days: 7

  semantic-pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run semantic pack
        run: |
          uv run python -m ragleaklab run \
            --corpus data/corpus_private_canary \
            --pack semantic-basic \
            --out out/semantic/

      - name: Semantic regression check
        run: |
          uv run python -m ragleaklab diff \
            --baseline baselines/semantic_v1/report.json \
            --current out/semantic/report.json

      - name: Export semantic SARIF
        if: always()
        run: |
          uv run python -m ragleaklab export \
            --format sarif \
            --input out/semantic/report.json \
            --output out/semantic/report.sarif || true

      - name: Upload semantic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-semantic-reports
          path: out/semantic/
          retention-days: 7

