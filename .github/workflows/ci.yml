name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run CI smoke test
        run: bash scripts/ci_smoke.sh

      - name: Export SARIF
        if: always()
        run: |
          uv run python -m ragleaklab run \
            --corpus data/corpus_private_canary \
            --attacks data/attacks \
            --out out/
          uv run python -m ragleaklab export \
            --format sarif \
            --input out/report.json \
            --output out/report.sarif || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: out/
          retention-days: 7
