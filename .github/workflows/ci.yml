name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run CI smoke test
        run: bash scripts/ci_smoke.sh

      - name: Export SARIF
        if: always()
        run: |
          uv run python -m ragleaklab run \
            --corpus data/corpus_private_canary \
            --attacks data/attacks \
            --out out/
          uv run python -m ragleaklab export \
            --format sarif \
            --input out/report.json \
            --output out/report.sarif || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: out/
          retention-days: 7

  validate-results:
    name: Validate Results
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check for results changes
        id: changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^results/'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.changes.outputs.has_changes == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        if: steps.changes.outputs.has_changes == 'true'
        run: uv python install 3.12

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: uv sync --frozen --all-extras

      - name: Validate all results JSON files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          shopt -s nullglob
          failed=0
          for f in results/*.json; do
            echo "Validating: $f"
            if uv run ragleaklab bench validate-results --file "$f"; then
              echo "  ✅ Valid"
            else
              echo "  ❌ Invalid"
              failed=1
            fi
          done
          exit $failed

