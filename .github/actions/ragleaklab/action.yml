name: 'RAGLeakLab Security Audit'
description: 'Run RAGLeakLab security tests against RAG systems'
author: 'RAGLeakLab'

branding:
  icon: 'shield'
  color: 'red'

inputs:
  config_path:
    description: 'Path to ragleaklab.yaml config file'
    required: false
    default: ''
  pack:
    description: 'Attack pack name (e.g., canary-basic, verbatim-basic, semantic-basic)'
    required: false
    default: ''
  corpus_path:
    description: 'Path to corpus directory (if not using config)'
    required: false
    default: ''
  attacks_path:
    description: 'Path to attacks YAML file or directory (if not using config)'
    required: false
    default: ''
  baseline_path:
    description: 'Path to baseline report.json for regression comparison'
    required: false
    default: ''
  out_dir:
    description: 'Output directory for reports'
    required: true
  python_version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  upload_artifacts:
    description: 'Upload reports as GitHub artifacts'
    required: false
    default: 'true'
  artifact_name:
    description: 'Name for uploaded artifact'
    required: false
    default: 'ragleaklab-reports'

outputs:
  report_path:
    description: 'Path to generated report.json'
    value: ${{ steps.run.outputs.report_path }}
  sarif_path:
    description: 'Path to generated results.sarif'
    value: ${{ steps.run.outputs.sarif_path }}
  junit_path:
    description: 'Path to generated junit.xml'
    value: ${{ steps.run.outputs.junit_path }}
  status:
    description: 'Audit status: pass or fail'
    value: ${{ steps.run.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: 'latest'

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      run: uv sync --all-extras

    - name: Run RAGLeakLab
      id: run
      shell: bash
      run: |
        set +e  # Don't exit on error, capture status

        # Build command
        CMD="uv run python -m ragleaklab run"
        CMD="$CMD --out ${{ inputs.out_dir }}"
        CMD="$CMD --format junit --format sarif"

        # Add config or corpus/attacks
        if [ -n "${{ inputs.config_path }}" ]; then
          CMD="$CMD --config ${{ inputs.config_path }}"
        fi

        if [ -n "${{ inputs.corpus_path }}" ]; then
          CMD="$CMD --corpus ${{ inputs.corpus_path }}"
        fi

        if [ -n "${{ inputs.attacks_path }}" ]; then
          CMD="$CMD --attacks ${{ inputs.attacks_path }}"
        fi

        if [ -n "${{ inputs.pack }}" ]; then
          CMD="$CMD --pack ${{ inputs.pack }}"
        fi

        echo "Running: $CMD"
        eval $CMD
        RUN_STATUS=$?

        # Set outputs
        echo "report_path=${{ inputs.out_dir }}/report.json" >> $GITHUB_OUTPUT
        echo "sarif_path=${{ inputs.out_dir }}/results.sarif" >> $GITHUB_OUTPUT
        echo "junit_path=${{ inputs.out_dir }}/junit.xml" >> $GITHUB_OUTPUT

        if [ $RUN_STATUS -eq 0 ]; then
          echo "status=pass" >> $GITHUB_OUTPUT
        else
          echo "status=fail" >> $GITHUB_OUTPUT
        fi

        # Propagate exit status for baseline check
        exit $RUN_STATUS

    - name: Regression check
      if: inputs.baseline_path != ''
      shell: bash
      run: |
        uv run python -m ragleaklab diff \
          --baseline ${{ inputs.baseline_path }} \
          --current ${{ inputs.out_dir }}/report.json

    - name: Generate Step Summary
      if: always()
      shell: bash
      run: |
        echo "## 🔍 RAGLeakLab Security Audit Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        uv run python -m ragleaklab report summarize \
          --in ${{ inputs.out_dir }} \
          --top 20 \
          --format md >> $GITHUB_STEP_SUMMARY || echo "⚠️ Could not generate summary" >> $GITHUB_STEP_SUMMARY

    - name: Annotate Failures
      if: always()
      shell: bash
      run: |
        uv run python -m ragleaklab report annotate \
          --in ${{ inputs.out_dir }} \
          --max 30 || true

    - name: Upload artifacts
      if: inputs.upload_artifacts == 'true' && always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          ${{ inputs.out_dir }}/report.json
          ${{ inputs.out_dir }}/results.sarif
          ${{ inputs.out_dir }}/junit.xml
          ${{ inputs.out_dir }}/runs.jsonl
        if-no-files-found: warn

    - name: Upload SARIF to GitHub Security
      if: always() && hashFiles(format('{0}/results.sarif', inputs.out_dir)) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.out_dir }}/results.sarif
        category: ragleaklab
      continue-on-error: true
