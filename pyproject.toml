[project]
name = "ragleaklab"
version = "1.0.0"
description = "RAGLeakLab — security testing toolkit for detecting data leakage, poisoning, and ACL isolation failures in Retrieval-Augmented Generation systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "faker>=40.1.2",
]

[project.urls]
Homepage = "https://github.com/ragleaklab/ragleaklab"
Documentation = "https://github.com/ragleaklab/ragleaklab/blob/main/README.md"
Issues = "https://github.com/ragleaklab/ragleaklab/issues"

[project.scripts]
ragleaklab = "ragleaklab.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.4.0",
    "responses>=0.25.0",
    "hypothesis>=6.100.0",
    "cyclonedx-bom>=4.0.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleaklab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for typer)
]

[tool.ruff.lint.isort]
known-first-party = ["ragleaklab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow/nightly (fuzz, property-based)",
]
