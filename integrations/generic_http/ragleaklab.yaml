# RAGLeakLab Config — Generic HTTP Integration
#
# Template for any HTTP RAG service with env-based auth.
# Copy and customize for your service.
#
# Environment variables:
#   RAG_API_TOKEN — Bearer token or API key

version: "1"

target:
  type: http
  url: https://rag.example.com/api/v1/query
  method: POST

  # Auth — use environment variables, never hardcode secrets
  headers:
    Authorization: "${RAG_API_TOKEN}"
    Content-Type: "application/json"

  # Request body template
  # {{query}} is replaced with the attack query at runtime
  request_json:
    query: "{{query}}"
    max_tokens: "512"

  # Response field mapping
  response:
    answer_field: "answer"
    # Optional: if your API returns retrieval context
    # context_field: "context"
    # retrieved_ids_field: "doc_ids"
    # scores_field: "relevance_scores"

  # Timeouts and rate limiting
  timeout_sec: 60
  max_rps: 2.0

  # SSRF protection — explicit allowlist required in production
  allowed_domains:
    - "rag.example.com"
  require_allowlist: true
  allow_localhost: false

  # Redact secrets in outputs
  redact_output: true

# Pass/fail thresholds (adjust for your risk tolerance)
thresholds:
  verbatim_delta: 0.01
  membership_delta: 0.05
  canary_max_count: 0
  verbatim_max_score: 0.1
  membership_max_auc: 0.65

# Output formats
output:
  formats:
    - json
    - sarif
  redact: true
