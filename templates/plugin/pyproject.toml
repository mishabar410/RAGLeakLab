[project]
name = "ragleaklab-example-plugin"
version = "0.1.0"
description = "Example RAGLeakLab plugin — custom metric + pack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ragleaklab>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

# ---- Entry points: how RAGLeakLab discovers your plugin ----
# Each section maps a plugin kind to one or more name=import_path pairs.
# Supported kinds:
#   ragleaklab.metrics  — custom scoring functions
#   ragleaklab.attacks  — custom attack strategies
#   ragleaklab.targets  — custom RAG target adapters

[project.entry-points."ragleaklab.metrics"]
example_metric = "example_plugin.metric:compute_example_metric"

# Uncomment to also register a custom attack:
# [project.entry-points."ragleaklab.attacks"]
# example_attack = "example_plugin.attack:ExampleAttack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_plugin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
