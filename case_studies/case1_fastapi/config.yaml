# RAGLeakLab Configuration for Case Study 1: FastAPI Target
#
# Tests the local FastAPI server at localhost:8000
#
# Usage:
#   1. Start server: uvicorn examples.fastapi_target.app:app --port 8000
#   2. Run: ragleaklab run --config case_studies/case1_fastapi/config.yaml \
#           --corpus data/corpus_private_canary --attacks data/attacks --out out/

target:
  type: http
  url: http://127.0.0.1:8000/ask
  method: POST
  request_json:
    question: "{{query}}"
  response:
    answer_field: "answer"
  timeout_sec: 30

thresholds:
  verbatim_delta: 0.01
  membership_delta: 0.05
  canary_max_count: 0
