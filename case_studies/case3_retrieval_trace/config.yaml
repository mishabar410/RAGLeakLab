# RAGLeakLab Configuration for Case Study 3: Retrieval Trace
#
# Tests the mock trace server that returns retrieved_ids for attribution
#
# Usage:
#   1. Start server: python examples/mock_trace_server.py
#   2. Run: ragleaklab run --config case_studies/case3_retrieval_trace/config.yaml \
#           --corpus data/corpus_private_canary --attacks data/attacks --out out/

target:
  type: http
  url: http://127.0.0.1:8002/ask
  method: POST
  request_json:
    question: "{{query}}"
  response:
    answer_field: "answer"
    context_field: "context"
    retrieved_ids_field: "retrieved_ids"
  timeout_sec: 30

thresholds:
  verbatim_delta: 0.01
  membership_delta: 0.05
  canary_max_count: 0
